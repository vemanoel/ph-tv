name: release
on:
  workflow_dispatch: 
    inputs:
      version:
        type: string
        required: true
        description: "version"
  
jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    env:
      COMPOSE_FILE: compose.ci.yaml
      PODMAN_COMPOSE_PROVIDER: /usr/bin/podman-compose
  
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
  
      - name: Install Podman with socket service
        uses: redhat-actions/podman-install@v1
        with:
          start-service: 'true'
  
      - name: install podman-compose
        run: sudo apt install --yes podman-compose

      - name: Build image
        run: podman compose build dev

      - name: Build artifacts
        run: make build

      - uses: softprops/action-gh-release@v3
        with:
          files: build/*
          generate_release_notes: true
          tag_name: v0.0.0
  
