name: release
on:
  workflow_dispatch: 
    inputs:
      version:
        type: string
        required: true
        description: "version"
  
jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build image
        run: podman compose build dev

      - name: Build artifacts
        run: |
          podman compose run --rm -e GOOS=darwin -e GOARCH=amd64 dev go build -ldflags "-s -w" -o build/raccoon_${{ inputs.version }}_darwin-amd64 cmd/main.go
          podman compose run --rm -e GOOS=darwin -e GOARCH=arm64 dev go build -ldflags "-s -w" -o build/raccoon_${{ inputs.version }}_darwin-arm64 cmd/main.go
          podman compose run --rm -e GOOS=linux -e GOARCH=amd64 dev go build -ldflags "-s -w" -o build/raccoon_${{ inputs.version }}_linux-amd64 cmd/main.go
          podman compose run --rm -e GOOS=linux -e GOARCH=386 dev go build -ldflags "-s -w" -o build/raccoon_${{ inputs.version }}_linux-386 cmd/main.go
          podman compose run --rm -e GOOS=windows -e GOARCH=amd64 dev go build -ldflags "-s -w" -o build/raccoon_${{ inputs.version }}_windows-amd64.exe cmd/main.go
          podman compose run --rm -e GOOS=windows -e GOARCH=386 dev go build -ldflags "-s -w" -o build/raccoon_${{ inputs.version }}_windows-386.exe cmd/main.go

      - uses: softprops/action-gh-release@v3
        with:
          files: build/*
          generate_release_notes: true
          tag_name: v0.0.0
  
