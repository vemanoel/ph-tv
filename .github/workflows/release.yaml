name: release
on:
  workflow_dispatch: 
    inputs:
      version:
        type: string
        required: true
        description: "version"
  
jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build image
        run: podman compose build dev

      - name: Build artifacts
        run: podman compose run --rm dev make build

      - uses: softprops/action-gh-release@v3
        with:
          files: build/*
          generate_release_notes: true
          tag_name: v0.0.0
  
